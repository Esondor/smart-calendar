<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a time</title><link rel="icon" href="/icon.svg"><meta name="robots" content="noindex">
<style>
:root{color-scheme:light dark;--acc:#007aff;--fill:color-mix(in srgb,CanvasText 8%,transparent);--muted:color-mix(in srgb,CanvasText 55%,transparent);--line:color-mix(in srgb,CanvasText 12%,transparent)}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:Canvas;color:CanvasText;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:40px 20px 60px}h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--fill);border-radius:16px;padding:14px 16px;margin-bottom:14px}.lbl{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px}.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.day{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 6px}.times{display:flex;flex-wrap:wrap;gap:8px}
.t{border:0;padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.t.good{background:var(--fill);color:CanvasText}.t.on{background:var(--acc);color:#fff}
input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:Canvas;color:CanvasText;margin-bottom:8px}
.row{display:flex;gap:8px}.row input{margin-bottom:0}
.btn{border:0;background:var(--acc);color:#fff;font:inherit;font-weight:600;padding:12px 20px;border-radius:999px;cursor:pointer;width:100%}.btn:disabled{opacity:.45}
.link{border:0;background:none;color:var(--acc);font:inherit;cursor:pointer;padding:8px 0}.err{color:#ff3b30;font-size:14px;min-height:20px}.hint{color:var(--muted);font-size:14px}
.done{text-align:center;padding:40px 10px}.done h1{margin-bottom:8px}[hidden]{display:none!important}
</style></head><body><main id="app"><p class="hint">Loading…</p></main><script src="/js/book.js"></script></body></html>
